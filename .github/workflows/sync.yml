name: Sync Pages Index

on:
  schedule:
    - cron: "30 0 * * *" # 每日 UTC 00:30（北京时间 08:30）
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened] # 【收藏】issue 变化时自动同步

permissions:
  contents: write
  issues: read

concurrency:
  group: sync-pages-index
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sites.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto update sites index"
            git push
          fi
